name: validate

# Manual only: automatic push, pull-request and scheduled runs are disabled by owner decision (2026-10-23).
# The local gate is the merge evidence; dispatch this workflow deliberately when a hosted run is wanted.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci needs the committed lockfile: the checks are only meaningful if
      # CI resolves the same @atproto/lexicon the schema was validated against.
      - run: npm ci
      - run: npm test
